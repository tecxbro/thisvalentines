[project]
name = "valentines-reels-backend"
version = "0.1.0"
description = "Backend API and LiveKit agent worker for Valentines reels avatars."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "mistralai>=1.0.0",
    "livekit-agents>=1.4.1",
    "livekit-api>=1.0.4",
    "livekit-plugins-elevenlabs>=1.4.1",
    "livekit-plugins-lemonslice>=1.4.1",
    "livekit-plugins-mistralai>=1.4.1",
    "livekit-plugins-silero>=1.4.1",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pyjwt>=2.10.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
