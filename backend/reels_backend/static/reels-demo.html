<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentines Reels Demo</title>
    <style>
      :root {
        --bg: #0b1220;
        --card: #131d31;
        --text: #f5f7fb;
        --muted: #9bb0d3;
        --accent: #4de0a8;
        --danger: #ff6b6b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at 25% 10%, #1e2d50, #0b1220 45%);
        color: var(--text);
      }
      .shell {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .reel {
        width: min(420px, 100%);
        background: linear-gradient(180deg, #1a2742, #121b2f);
        border: 1px solid #293a62;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
      .top {
        padding: 12px 14px;
        border-bottom: 1px solid #25365b;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .title {
        font-weight: 700;
        font-size: 14px;
      }
      .avatar-id {
        color: var(--muted);
        font-size: 12px;
      }
      .stage {
        aspect-ratio: 9 / 16;
        background: #0a1020;
        position: relative;
        overflow: hidden;
      }
      .stage img,
      .stage video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .stage .stage-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        font-weight: 700;
        color: var(--muted);
        background: #0a1020;
      }
      .idle-cta {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        background: rgba(10, 16, 32, 0.88);
        border: 1px solid #314977;
        border-radius: 10px;
        padding: 8px;
        font-size: 12px;
        display: none;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 12px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        background: #23345a;
        color: var(--text);
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      .connect {
        background: var(--accent);
        color: #072417;
      }
      .disconnect {
        background: var(--danger);
        color: #34090f;
      }
      .status {
        padding: 0 12px 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .hint {
        color: #87a0cb;
        font-size: 12px;
        padding: 0 12px 14px;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="reel">
        <header class="top">
          <div>
            <div id="displayName" class="title">Loading avatars...</div>
            <div id="avatarId" class="avatar-id">-</div>
          </div>
          <div id="indexLabel" class="avatar-id">0 / 0</div>
        </header>

        <div id="stage" class="stage">
          <div id="idleCta" class="idle-cta"></div>
        </div>

        <div class="controls">
          <button id="prevBtn" type="button">Prev Reel</button>
          <button id="nextBtn" type="button">Next Reel</button>
          <button id="connectBtn" class="connect" type="button">Join & Talk</button>
          <button id="disconnectBtn" class="disconnect" type="button">Leave</button>
        </div>
        <div id="status" class="status">Booting...</div>
        <div class="hint">Use mouse wheel / arrow keys to swipe. On swipe while connected, it reconnects to the next avatar.</div>
      </section>
    </main>

    <script type="module" src="/demo-static/reels-demo.js"></script>
  </body>
</html>
